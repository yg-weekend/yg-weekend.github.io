name: דילים שבועיים

on:
  schedule:
    - cron: "0 5 * * 4"     # כל חמישי 05:00 UTC = 07:00 בחורף / 08:00 בקיץ בישראל
  workflow_dispatch:          # כפתור "Run workflow" להרצה ידנית

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: weekly-deals
  cancel-in-progress: false

jobs:
  find-and-publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: חיפוש דילים
        env:
          TRAVELPAYOUTS_TOKEN: ${{ secrets.TRAVELPAYOUTS_TOKEN }}
          TRAVELPAYOUTS_MARKER: ${{ secrets.TRAVELPAYOUTS_MARKER }}
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
        run: python engine/finder.py

      - name: שמירת התוצאות וההיסטוריה
        run: |
          git config user.name "deals-bot"
          git config user.email "deals-bot@users.noreply.github.com"
          git add site/data
          git commit -m "דילים $(date +%F)" || echo "אין שינוי"
          git push

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
