name: דילים שבועיים

on:
  schedule:
    - cron: "0 5,14 * * *"  # כל יום 05:00 ו-14:00 UTC = 07:00 ו-16:00 בחורף (08:00 ו-17:00 בקיץ)
  workflow_dispatch:          # כפתור "Run workflow" להרצה ידנית
  push:                       # כל שינוי בקבצי האתר מתפרסם מיד, בלי חיפוש דילים מחדש
    branches: [main]
    paths: ["site/**"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: weekly-deals
  cancel-in-progress: false

jobs:
  find-and-publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: חיפוש דילים
        if: github.event_name != 'push'
        env:
          TRAVELPAYOUTS_TOKEN: ${{ secrets.TRAVELPAYOUTS_TOKEN }}
          TRAVELPAYOUTS_MARKER: ${{ secrets.TRAVELPAYOUTS_MARKER }}
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
        run: python engine/finder.py

      # עמודי היעד (site/dest) ומפת האתר נבנים מחדש מהדילים. אם הבנייה נכשלת, האתר ממשיך לעלות עם העמודים הקודמים.
      - name: עמודי יעד ומפת אתר
        continue-on-error: true
        run: python engine/pages.py

      - name: שמירת התוצאות וההיסטוריה
        if: github.event_name != 'push'
        run: |
          git config user.name "deals-bot"
          git config user.email "deals-bot@users.noreply.github.com"
          git add site/data site/dest site/sitemap.xml
          git commit -m "דילים $(date +%F)" || echo "אין שינוי"
          git push

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
        continue-on-error: true
      # לפעמים GitHub עוד לא "רואה" את הקבצים שהועלו. מחכים ומנסים שוב.
      - if: steps.deploy.outcome == 'failure'
        run: sleep 45
      - id: deploy_retry
        if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v4
