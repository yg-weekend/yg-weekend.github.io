<style>
  :root {
    --sky: #e6f0f7; --ink: #0a2342; --ink-2: #3c5677; --paper: #ffffff;
    --sun: #c94a0c; --sun-ink: #ffffff; --sea: #08777a; --leaf: #0f7a4b; --line: #d3e1ec;
    --wa: #0f7d43;
    --display: "Secular One", "Assistant", system-ui, sans-serif;

  * { box-sizing: border-box; }
  body { margin: 0; background: var(--sky); color: var(--ink); font: 17px/1.5 var(--body); }

  :focus-visible { outline: 3px solid #ffb703; outline-offset: 2px; box-shadow: 0 0 0 5px var(--ink); }
  .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
  .skip { position: absolute; top: -60px; right: 12px; z-index: 20; background: #fff; color: var(--ink); font-weight: 800;
          padding: 10px 16px; border-radius: 10px; text-decoration: none; }

  /* ---------- cover: the week's cheapest deal ---------- */
  .cover { position: relative; color: #fff; background: linear-gradient(to bottom, #050d1c 0%, #081a33 100%); overflow: hidden; }
  /* תמונת האווירה של האתר: זריחה מחלון המטוס. יושבת מאחורי הכותרת ונמוגה לפני המשבצות */
  .cover .sky { position: absolute; top: 0; left: 0; right: 0; height: 340px;
                background: linear-gradient(rgba(5,13,28,.25), rgba(5,13,28,.25)),
                            url("https://thumb.wikimedia.org/wikipedia/commons/thumb/7/73/Flying_through_the_sunrise_-_Flickr_-_Lenny_K_Photography.jpg/1280px-Flying_through_the_sunrise_-_Flickr_-_Lenny_K_Photography.jpg") center 61% / cover no-repeat;
                -webkit-mask-image: linear-gradient(to bottom, #000 62%, transparent 100%);
                        mask-image: linear-gradient(to bottom, #000 62%, transparent 100%); }
  .cover .sky-credit { position: absolute; bottom: 5px; left: 10px; z-index: 1; font-size: 11px; color: #fff; opacity: .7;

  .cover h1, .cover .kicker, .cover .lede { text-shadow: 0 1px 8px rgba(0,0,0,.55); }
  .cover .in { position: relative; z-index: 1; width: 100%; max-width: 1040px; margin: 0 auto; padding: 70px 20px 30px; }
  .cover .lede { margin: 0 0 18px; font-size: 17px; font-weight: 600; opacity: .92; max-width: 560px; }
  /* ארבע משבצות: הזול ביותר לכל סופ"ש */

  .wk-tile .go:focus-visible { outline-offset: -5px; }
  .wk-when { font-weight: 800; font-size: 16px; text-shadow: 0 1px 3px rgba(0,0,0,.6); }

  .wk-bot { display: flex; flex-direction: column; align-items: flex-start; gap: 8px; }

  .chip { border: 1px solid var(--line); background: #fff; color: var(--ink); font: inherit; font-weight: 600;

  main { max-width: 1040px; margin: 0 auto; padding: 22px 16px 120px; }

  .count { color: var(--ink-2); font-weight: 600; margin: 0 0 14px; }

  .ph { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .photo .city span { font-size: 22px; margin-left: 6px; }
  /* ב-Windows אין אימוג'י של דגלים ורואים אותיות (CY) במקום דגל, אז מסתירים */
  html.no-flags .photo .city span { display: none; }
  .chip.tgl.on { border-color: var(--sea); background: #e0f3f3; color: #06676a; }
  .photo .tag-price { position: absolute; z-index: 1; top: 12px; left: 12px; background: var(--sun); color: #fff;
                      font-family: var(--display); font-size: 26px; line-height: 1; padding: 7px 12px 8px;
                      border-radius: 10px; transform: rotate(-3deg); box-shadow: 0 4px 12px -4px rgba(0,0,0,.35); }
  .photo .drop { position: absolute; z-index: 1; top: 14px; right: 12px; background: var(--leaf); color: #fff;
                 font-weight: 800; font-size: 13px; padding: 4px 10px; border-radius: 999px; }
  .photo .pc, .wk-tile .pc { position: absolute; z-index: 1; bottom: 4px; left: 8px; font-size: 11px; color: #fff; text-shadow: 0 1px 2px #000;
               max-width: 60%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-decoration: none; }
  .wk-tile .pc { z-index: 2; max-width: 92%; opacity: .85; }
  /* perforation between the photo and the stub */
  .perf { height: 18px; position: relative;
          background: radial-gradient(circle at 0 50%, var(--sky) 9px, transparent 10px) left / 18px 18px no-repeat,
                      radial-gradient(circle at 100% 50%, var(--sky) 9px, transparent 10px) right / 18px 18px no-repeat; }
  .perf::before { content: ""; position: absolute; top: 50%; left: 18px; right: 18px; border-top: 2px dashed var(--line); }
  .stub { padding: 2px 18px 18px; display: flex; flex-direction: column; gap: 12px; flex: 1; }
  .fare { display: flex; justify-content: space-between; align-items: baseline; }
  .fare b { font-size: 15px; } .fare span { color: var(--ink-2); font-size: 14px; font-weight: 600; }
  .legs { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; font-size: 15.5px; }
  .legs dt { color: var(--ink-2); font-weight: 700; } .legs dd { margin: 0; font-weight: 600; }
  .pills { display: flex; flex-wrap: wrap; gap: 6px; font-size: 13px; font-weight: 700; }
  .pill { background: #eef4f9; color: var(--ink-2); padding: 3px 9px; border-radius: 6px; }
  .pill.live { background: #e3f4ea; color: var(--leaf); }
  .pill.sh { background: #e0f3f3; color: #06676a; }
  .transfer { font-size: 13px; line-height: 1.5; color: var(--ink-2); margin: 0 0 8px; }
  .transfer .est { opacity: .85; }
  .book { margin-top: auto; display: block; text-align: center; background: var(--ink); color: #fff; text-decoration: none;
          font-weight: 800; font-size: 17px; padding: 12px; border-radius: 12px; }
  .book:hover { background: #12345f; }
  .compare { margin: -4px 0 0; text-align: center; font-size: 13.5px; color: var(--ink-2); }
  .compare a { color: #06676a; font-weight: 700; display: inline-block; padding: 4px 2px; }
  .extras { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .extra { display: block; text-align: center; text-decoration: none; font-weight: 700; font-size: 15px;
           padding: 9px 6px; border-radius: 10px; border: 1.5px solid var(--line); color: var(--ink); background: #f6f9fc; }
  .extra:hover { border-color: var(--ink-2); }
  .extras.one { grid-template-columns: 1fr; }
  .empty { text-align: center; color: var(--ink-2); padding: 60px 0; font-size: 18px; }
  .wks { margin-top: 8px; }
  .search { width: 100%; box-sizing: border-box; font: inherit; font-size: 16px; padding: 11px 16px; margin: 10px 0 8px;
    border: 1px solid var(--line); border-radius: 999px; background: #fff; color: var(--ink); }
  .search:focus { outline: 3px solid var(--sea); outline-offset: 1px; }
  .more { display: block; margin: 24px auto 0; border: 2px solid var(--ink); background: #fff; color: var(--ink);

  /* ---------- WhatsApp share per deal ---------- */
  .share { display: flex; gap: 8px; margin-top: 8px; }
  .share .wa, .share .cp { font: inherit; font-weight: 700; font-size: 15px; border-radius: 12px; padding: 10px 12px; cursor: pointer; text-decoration: none; text-align: center; }
  .share .wa { flex: 1; background: var(--wa); color: #fff; border: 0; }
  .share .cp { background: #fff; color: var(--wa); border: 2px solid var(--wa); }
  .toast { position: fixed; bottom: 82px; left: 50%; transform: translateX(-50%); background: #fff; color: var(--leaf);
           font-weight: 700; padding: 8px 16px; border-radius: 999px; box-shadow: 0 6px 18px -8px rgba(0,0,0,.4);
           opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 7; }
  .toast.show { opacity: 1; }
  /* ---------- long weekend + kosher ---------- */
  .seg.mode button.on { background: var(--sun); }
  .days[hidden] { display: none; }
  .photo .long { position: absolute; z-index: 1; bottom: 50px; right: 14px; background: #fff; color: var(--ink);

  .save { margin: -4px 0 0; font-size: 14px; font-weight: 700; color: var(--leaf); }
  .kosher { border: 1.5px solid #cfe5e5; background: #f3fafa; border-radius: 12px; padding: 10px 12px; font-size: 14px; }
  .kosher p { margin: 0 0 8px; color: #164e50; line-height: 1.45; }
  .kosher p b { color: #06676a; }
  .kosher .kl { display: flex; flex-wrap: wrap; gap: 6px; }
  .kosher .kl a { text-decoration: none; font-weight: 700; font-size: 13.5px; color: #06676a; background: #fff;

  .kosher .kl a:hover { border-color: #06676a; }
  .kosher.none { background: #fff8ef; border-color: #f0d9bd; }
  .kosher.none p, .kosher.none p b { color: #7a4a12; }
  .kiwi { margin: 28px auto 0; max-width: 620px; text-align: center; background: #fff; border: 1px solid var(--line);
          border-radius: 14px; padding: 14px 18px; font-size: 15.5px; color: var(--ink-2); }
  .kiwi a { color: var(--sea); font-weight: 800; }
  footer { color: var(--ink-2); font-size: 13.5px; text-align: center; margin-top: 34px; }
  textarea.hidden { position: fixed; top: -1000px; }

  /* בטלפון סרגל הסינון גבוה מדי בשביל להישאר צמוד למעלה */
  @media (max-width: 760px) {
    .controls { position: static; }
    /* שמונה סופ"שים לא נכנסים בשורה: בטלפון גוללים אותם הצידה במקום לשבור לכמה שורות */
    .wks { flex-wrap: nowrap; overflow-x: auto; max-width: 100%; padding-bottom: 6px; }
    .wks .chip { flex: none; white-space: nowrap; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

    .concat(Object.values(data.lists).some(l => l.some(d => !d.stops)) ? [`<button class="chip tgl" id="direct" aria-pressed="false">✈ ישירות בלבד</button>`] : []).join("");
  if ($("#direct")) $("#direct").onclick = () => { state.direct = !state.direct; state.shown = 20; render(); };
  $("#wks").innerHTML = [`<button class="chip on" data-wk="">כל הסופ"שים</button>`]
    .concat(data.weekends.map((w, i) => `<button class="chip" data-wk="${w}">${i === 0 ? "הקרוב: " : ""}${wkLabel(w)}</button>`)).join("");
  document.querySelectorAll("#chips .chip[data-max]").forEach(b => b.onclick = () => { state.max = +b.dataset.max || null; state.shown = 20; render(); });
  document.querySelectorAll("#wks .chip").forEach(b => b.onclick = () => { state.wk = b.dataset.wk || null; state.shown = 20; render(); });
  document.querySelectorAll("#seg button").forEach(b => b.onclick = () => { state.list = b.dataset.list; state.shown = 20; render(); });
  $("#more").onclick = () => { state.shown += 20; render(); };
  // לחיצה על משבצת סופ"ש למעלה: מסננת את הרשימה לסופ"ש הזה וגוללת אליה. לחיצה נוספת מבטלת.
  $("#coverIn").addEventListener("click", (e) => {
    const b = e.target.closest(".go"); if (!b) return;
    const w = b.dataset.wk;
    state.wk = state.wk === w ? null : w; state.shown = 20; render();
    const nb = document.querySelector(`#coverIn .go[data-wk="${w}"]`);
    if (nb) nb.focus({ preventScroll: true });
    if (state.wk) $(".controls").scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: "start" });
  });
  const hasLong = Object.values(data.lists).some(l => l.some(d => d.long));
  $("#mode").hidden = !hasLong;
  $("#days").innerHTML = [`<button class="chip on" data-day="">כל ימי היציאה</button>`]
    .concat([2, 3, 4, 5].map(n => `<button class="chip" data-day="${n}">יציאה ב${DAYS[n]}</button>`)).join("");
  document.querySelectorAll("#mode button").forEach(b => b.onclick = () => { state.mode = b.dataset.mode; state.day = null; state.shown = 20; render(); });
  document.querySelectorAll("#days .chip").forEach(b => b.onclick = () => { state.day = b.dataset.day === "" ? null : +b.dataset.day; state.shown = 20; render(); });
  if (data.kiwi_link) {
    $("#kiwi").innerHTML = `רוצים לבדוק עוד אפשרויות? אפשר לחפש גם ב-<a href="${esc(data.kiwi_link)}" target="_blank" rel="noopener">Kiwi.com</a> (נפתח בחלון חדש). שם יש גם שילובים של חברות תעופה שונות להלוך ולחזור.`;
    $("#kiwi").hidden = false;
  }
  // הצעות בזמן הקלדה: קודם המדינות שיש אליהן דילים (עם הערים שלהן), ואחריהן הערים
  const byCountry = new Map(), cities = new Set();
  Object.values(data.lists).forEach(l => l.forEach(d => {
    cities.add(d.name);
    const c = countryName(d.flag); if (!c) return;
    if (!byCountry.has(c)) byCountry.set(c, new Set());
    byCountry.get(c).add(d.name);
  }));
  const he = (a, b) => a.localeCompare(b, "he");
  $("#qlist").innerHTML = [...byCountry.keys()].sort(he).map(c => `<option value="${esc(c)}" label="${esc([...byCountry.get(c)].sort(he).join(", "))}"></option>`)
    .concat([...cities].sort(he).map(n => `<option value="${esc(n)}"></option>`)).join("");
  $("#q").oninput = (e) => { state.q = e.target.value.trim(); state.shown = 20; render(); };
  document.addEventListener("click", async (e) => {
    const b = e.target.closest("[data-copy]"); if (!b) return;
    const d = (state.cur || [])[+b.dataset.copy]; if (!d) return;
    toast(await copyText(dealText(d)) ? "הדיל הועתק. עכשיו מדביקים בוואטסאפ" : "ההעתקה לא עבדה. נסו \"שליחה בוואטסאפ\"");
  });
  $("#foot").textContent = "המחירים לאדם, בשקלים. השעות לפי השעון המקומי. זמני שבת מחושבים לפי השקיעה ביעד, כדאי לוודא מול לוח מקומי. התמונות מוויקישיתוף. חלק מהקישורים הם קישורי שותפים: אנחנו עשויים לקבל עמלה, בלי עלות נוספת עבורכם.";
  render();
}

if (window.DEALS_DATA) init(window.DEALS_DATA);
else fetch("data/deals.json", {cache: "no-store"}).then(r => r.json()).then(init)
  .catch(() => { $("#coverIn").innerHTML = "<h1>הדילים לא נטענו</h1><p>רעננו את הדף בעוד דקה.</p>"; });
</script>
<script src="a11y.js"></script>
</body>
</html>
